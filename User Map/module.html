<!doctype html>
<html lang="de">

<head>
    <title>Symcon User Map</title>
    <meta charset="utf-8" />
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: transparent;
            border-radius: 10px;
        }

        body {
            position: fixed;
            inset: 0;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #map {
            position: absolute;
            inset: 0;
        }

        .error {
            position: absolute;
            left: 45vw;
            text-align: center;
        }

        .leaflet-top .leaflet-control {
            margin-top: var(--margin-top) !important;
        }

        .leaflet-left .leaflet-control {
            margin-left: var(--margin-side) !important;
        }

        .leaflet-popup-content {
            text-align: center;
        }

        .leaflet-popup-content h1 {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 0.5rem;
        }

        #user-control {
            position: absolute;
            top: var(--margin-top);
            right: var(--margin-side);
            z-index: 1000;
        }

        #user-toggle {
            width: 34px;
            height: 34px;
            border: 2px solid rgba(0, 0, 0, .2);
            border-radius: 4px;
            background: white;
            color: black;
            cursor: pointer;
            font-size: 18px;
            font-weight: 700;
        }

        #user-list {
            display: none;
            position: absolute;
            right: 0;
            top: 42px;
            width: 15em;
            max-height: 80vh;
            overflow-y: auto;
            list-style: none;
            margin: 0;
            padding: .5em;
            background: color-mix(in srgb, var(--card-color) 40%, transparent);
            backdrop-filter: blur(2px);
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
        }

        #user-list.open {
            display: block;
        }

        #user-list li {
            padding: .4em;
            cursor: pointer;
        }

        #user-list li:hover {
            border-radius: 4px;
            background: var(--accent-color);
        }

    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        // ── INIT: set root/style variables ───────────────────────────────────
        const p = new URLSearchParams(location.search);
        const r = document.documentElement;
        const m = {
            margintop: ['--margin-top'],
            marginside: ['--margin-side'],
            marginbottom: ['--margin-bottom']
        };
        for (const k in m) {
            const v = p.get(k);
            if (!v) continue; m[k].forEach(c => r.style.setProperty(c, v));
        }

        // ── SDK: handleMessage (data transfer) ───────────────────────────────
        function handleMessage(data) {
            //console.log('Rohdaten empfangen:', data);
            const decodedData = JSON.parse(data);
            //console.log('Decodierte Daten:', decodedData);
            var root = document.documentElement;
            for (const parameter in decodedData) {
                console.log('Parameter:', parameter, 'Wert:', decodedData[parameter]);
                switch (parameter) {
                    default:
                        console.log('Unbekannter Parameter:', parameter);
                        break;
                }
            }
        }
    </script>
</head>

<body>
    <div id="map"
        class="leaflet-container leaflet-touch leaflet-fade-anim leaflet-grab leaflet-touch-drag leaflet-touch-zoom">
        <div class=leaflet-control-container>
            <div class="leaflet-bottom leaflet-left">
                <div class="leaflet-control-attribution"><span id=user-count>0</span> registrierte Nutzer!</div>
            </div>
        </div>
    </div>
    <div id="user-control">
        <button id="user-toggle" aria-label="Menü öffnen">☰</button>
        <ul id="user-list"></ul>
    </div>
    <script>
        fetch("https://wilkware.de/wp-json/usermap/symcon/").then(e => e.json()).then(e => {
            var t, o, r, i = 5, n = L.map("map").setView([52, 13], i);
            n.options.minZoom = 3, L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                attribution: '&copy; OSM contributors'
            }).addTo(n);
            n.on('click', function () {
                document.getElementById("user-list").classList.remove("open");
            });
            const s = {}, a = [];
            for (const t of e) {
                if (o = "<h1>" + t.name + "</h1>", t.links) {
                    r = !0;
                    for (const e in t.links) r || (o += "<br>"), o += '<a target="_blank" href="' + t.links[e] + '">' + e + "</a>", r = !1
                }
                const userIcon = L.icon({
                    iconUrl: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABkAAAApCAMAAAD3TXL8AAABNVBMVEUAAAAwoZ8wo6Ayn580p6Y2ratHwsAvm5k3sa4tmZcumJUunp05t7M+tbI/u7gtmZYtmZcul5UumJUwoJ4xo6Iul5UumJYvmpcumZY3t7Y2tLAqmJkzp6Y5uLUtmZgtmZcvnZsxo6EzqKY4uLcvoJs0p6Qul5M1rKg2s7A4tbM4tLE2sK42sK4ul5U3tLE3t7U2sK05sLP///8tycswysw7zs4ox8pBz801zM1G0M0lxsofw8krx8s/z843zc09zsxEz805zc0yysxI0dEjxMpZ1dMiw8ld1tJO09FD0NE/ztBK0c42y840u71T09A7y88awchW1NMxyM5QzclLysk7wcREwL4vx8xAw8MwtLev6+vB29s0y841x84zxcxOysg+vLw4trN31tZY0MwwwshAxMcxtbhwfXZwAAAAMnRSTlMA9RUL9vX6+vfx+vn4+PXp2nBYP/aEeVBKLiUH5+bkzsnAr4yCcWRgRNLMvrSMgnhRG6UotrgAAAHPSURBVDjLdc4Jd5pAEAfwAUXwNt7G3HfvdlvTRNEUkMot3uZOen3/j9DdBVo88ntvl5n5vwHgP7Z2VmNhxebh9nMqk3rePqzBgg+p2EjtYaNY6n144XXGUR3NvDQ1R/2ZebUJvjMh1nMuA04vJnz0v8yNVJMOEb1NdSR8AuJtRv1GIYS8Qo29AexUGChfCUTQShkIpwAR7lELAnoI7ZGLQIEbtAk8DG5swBXgOK1dYXh0FXpq6WM4mCqNRgMPGkRQKdMD2BrruA2SoNTHW8CM25Ik4VaSbm5++JXUHhdhf6p3MITIuaUFpk/34SitXGAIkXNL3kZaJX0ElWgowfwkWgWWNzuyLCOEjwd3HZNnAfaejC/LjKc9AMgziuz1Vt/yKllhKjipx+fS50XSPAtEidOXEj26AQSb+G2JYdY8wQL1Lmqch4hGtATgL03uQsnFJB4BXwkvNQPnRrEMgUh8MvyX3NGVQLnYb3Y9zT6Dfyy0ZA+/e4Z2NgIhG0y/2yK6ZCWsnrVnNJnZ2TosOGEsmljMCSzZsUXXdWf2DizLJ+9bbus+mYcVuT+iK17nAFtZemg98BVYI3c9pCurqvwvvgpr7SZ3Yb1CogAvKEPIX+LkiWi7ftkKAAAAAElFTkSuQmCC',
                    iconSize: [25, 41],
                    iconAnchor: [12, 41],
                });
                const i = L.marker(t.coords, { icon: userIcon }).addTo(n).bindPopup(o);
                s[t.name] = i, a.push(t.name)
            }
            document.getElementById("user-toggle").addEventListener("click", function () {
                document.getElementById("user-list").classList.toggle("open");
            });
            document.getElementById("user-count").innerText = String(e.length), a.sort(function (e, t) {
                return e.toLowerCase().localeCompare(t.toLowerCase())
            });
            const u = document.getElementById("user-list");
            L.DomEvent.disableClickPropagation(u);
            L.DomEvent.disableScrollPropagation(u);
            for (const e of a) t = document.createElement("li"), t.innerText = e, t.addEventListener("mouseenter", function () {
                s[e].openPopup()
            }), t.addEventListener("mouseleave", function () {
                s[e].closePopup()
            }), t.addEventListener("mousedown", function () {
                i = n.getZoom(), n.flyTo(s[e].getLatLng(), 16)
            }), t.addEventListener("mouseup", function () {
                n.flyTo(s[e].getLatLng(), i)
            }), u.appendChild(t)
        })
    </script>
</body>

</html>
